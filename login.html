<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="description" content="Kreasiku: unggah & pamerkan portofolio, desain, logo, dan karya kreatif Anda.">
  <meta name="theme-color" content="#ffffff">
  <title>Login — Kreasiku</title>

  <!-- Global + page styles -->
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/login.css" />

  <!-- Same fonts used before (Sansita for “reasiku”) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Sansita:wght@700&display=swap" rel="stylesheet">

  <script defer src="JS/main.js"></script>
  <script defer src="JS/api.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    window.GOOGLE_CLIENT_ID = window.GOOGLE_CLIENT_ID || '974372260444-803bbgcege5to6lbaoi412sbv511l2av.apps.googleusercontent.com';
  </script>
</head>
<body>
  <div id="header"></div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.querySelector(".login-form");
      const statusBox = document.getElementById('magicStatus');
      const submitBtn = form?.querySelector('.btn-login');
      const emailInput = document.getElementById("email");

      const showPopup = (opts) => {
        if (window.notifyUser) {
          window.notifyUser(opts);
        } else {
          alert(opts.message || opts.title || '');
        }
      };

      const toggleLoading = (state) => {
        if (!submitBtn) return;
        submitBtn.disabled = state;
        submitBtn.classList.toggle('loading', !!state);
      };

      if (form) {
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = emailInput.value.trim();
          const name  = email.split("@")[0] || "Pengguna";
          if (!email) {
            statusBox.textContent = 'Masukkan email terlebih dahulu.';
            showPopup({ title: 'Email belum diisi', message: 'Isi alamat email kamu sebelum meminta magic link.', type: 'warning' });
            return;
          }
          statusBox.textContent = 'Mengirim magic link...';
          toggleLoading(true);
          try {
            await apiFetch('/auth/magic_request.php', {
              method: 'POST',
              headers: {'Content-Type':'application/json'},
              body: JSON.stringify({ email, name })
            });
            statusBox.textContent = `Link telah dikirim ke ${email}. Periksa inbox/spam untuk melanjutkan.`;
            showPopup({
              title: 'Magic link terkirim',
              message: `Kami telah mengirimkan tautan login ke ${email}. Buka inbox atau folder spam untuk melanjutkan.`,
              type: 'success'
            });
          } catch(err) {
            const msg = err?.message || 'Gagal mengirim magic link.';
            statusBox.textContent = msg;
            showPopup({ title: 'Gagal mengirim', message: msg, type: 'warning' });
          } finally {
            toggleLoading(false);
          }
        });
      }
      initGoogleOAuth();
    });

    function initGoogleOAuth() {
      const btn = document.querySelector('.btn-google');
      if (!btn) return;
      const clientId = window.GOOGLE_CLIENT_ID || '';
      if (!clientId || clientId.includes('YOUR_GOOGLE_CLIENT_ID')) {
        btn.addEventListener('click', () => alert('Google OAuth belum dikonfigurasi.')); 
        return;
      }

      let tokenClient = null;

      btn.addEventListener('click', (e) => {
        e.preventDefault();
        if (!window.google || !google.accounts || !google.accounts.oauth2) {
          alert('Google belum siap. Muat ulang halaman dan coba lagi.');
          return;
        }
        if (!tokenClient) {
          tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: clientId,
            scope: 'openid email profile',
            callback: () => {}
          });
        }
        btn.disabled = true;
        tokenClient.callback = async (tokenResponse) => {
          try {
            const resp = await apiFetch('/auth/google.php', {
              method: 'POST',
              headers: {'Content-Type':'application/json'},
              body: JSON.stringify({ access_token: tokenResponse.access_token })
            });
            localStorage.setItem('authUser', JSON.stringify(resp.user));
            location.href = 'pages/account/Account.html';
          } catch (err) {
            alert('Google login gagal: ' + err.message);
          } finally {
            btn.disabled = false;
          }
        };
        tokenClient.requestAccessToken({ prompt: 'consent' });
      });
    }
  </script>

  <main class="login-wrap">
    <section class="login-area" aria-labelledby="loginTitle">
      <h1 id="loginTitle" class="login-title">Login to your Account</h1>
      <p class="login-sub">See what is going on with your business</p>

      <!-- Continue with Google -->
      <button class="btn-google" type="button" aria-label="Continue with Google">
        <span class="g-icon" aria-hidden="true">
          <!-- Inline Google “G” logo (no external assets) -->
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M17.64 9.2045c0-.638-.057-1.252-.164-1.841H9v3.481h4.844c-.209 1.126-.842 2.08-1.796 2.72v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.618z" fill="#4285F4"/>
            <path d="M9 18c2.43 0 4.469-.806 5.959-2.177l-2.908-2.258c-.806.54-1.837.859-3.051.859-2.347 0-4.333-1.585-5.041-3.713H.955v2.332C2.436 15.983 5.481 18 9 18z" fill="#34A853"/>
            <path d="M3.959 10.711a5.41 5.41 0 010-3.422V4.957H.955A9 9 0 000 9c0 1.46.35 2.838.955 4.043l3.004-2.332z" fill="#FBBC05"/>
            <path d="M9 3.58c1.322 0 2.512.454 3.447 1.348l2.585-2.585C13.465.896 11.426 0 9 0 5.481 0 2.436 2.017.955 4.957l3.004 2.332C4.667 5.74 6.653 3.58 9 3.58z" fill="#EA4335"/>
          </svg>
        </span>
        <span>Continue with Google</span>
      </button>

      <div class="divider" role="separator">
        <span>or Sign in with Magic Email</span>
      </div>

      <form class="login-form" action="#" method="post" novalidate>
        <label for="email" class="field-label">Email</label>
        <input id="email" name="email" type="email" class="field-input" placeholder="mail@abc.com" required inputmode="email">
        <p class="magic-note">Kami akan mengirimkan tautan login (berlaku 15 menit) ke email Anda.</p>
        <p id="magicStatus" class="magic-status" role="status"></p>
        <button type="submit" class="btn-login">Kirim Magic Link</button>
      </form>
    </section>
  </main>

  <div id="footer"></div>
</body>
</html>
